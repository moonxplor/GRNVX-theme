# ==============================================================================
# Garuda Linux - Everforest Hyprland Configuration
# Styled with Everforest Dark palette & smooth sliding animations
# ==============================================================================

# Monitor Configuration
monitor=eDP-1,1366x768@60,0x0,1
monitor=,preferred,auto,1

# Default Applications
$terminal = kitty
$fileManager = thunar
$menu = ~/.local/bin/hypr-launcher.sh
$browser = brave
$screenshot = ~/.local/bin/hypr-screenshot.sh

# Autostart Core Daemons
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-kde-authentication-agent-1 || /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = nm-applet --indicator &
exec-once = hyprpaper
exec-once = quickshell
exec-once = /home/moonxplor/Downloads/garuda-theme/apply-theme.sh wallpaper subway

# Environment Variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = TERMINAL,kitty
env = PATH,$HOME/.local/bin:$PATH

# Input Device Configuration
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        tap-to-click = true
        scroll_factor = 0.4
    }
}

gestures {
    workspace_swipe_distance = 300
}

# New unified gesture syntax (Hyprland 0.51+)
gesture = 3, horizontal, workspace

# General Layout & Styling (Everforest Dark Palette)
general {
    gaps_in = 2
    gaps_out = 4
    border_size = 2

    # Everforest Green / Aqua Gradient for Active Windows
    col.active_border = rgb(a7c080) rgb(83c092) 45deg
    # Muted Charcoal for Inactive Windows
    col.inactive_border = rgb(2d353b)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

# Window Decorations
decoration {
    rounding = 10

    active_opacity = 0.97
    inactive_opacity = 0.88

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(00000066)
    }
}

# Animation Curves & Sliding Transitions
animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = easeOutQuint, 0.23, 1, 0.32, 1

    animation = windows, 1, 4, easeOutQuint
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 8, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 4, default
    # Smooth horizontal sliding workspaces
    animation = workspaces, 1, 5, myBezier, slide
}

# Layout Engine
dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    background_color = 0x1e2326
}

# Window Rules (Hyprland 0.55+ syntax)
windowrule = suppress_event maximize, match:class .*
windowrule = float true, match:class ^(pavucontrol|blueman-manager|zenity|yad)$
windowrule = center true, match:class ^(zenity|yad)$
windowrule = opacity 1.0 1.0, match:class ^(kitty)$
windowrule = opacity 0.95 0.90, match:class ^(thunar)$

# ------------------------------------------------------------------------------
# Keybindings
# ------------------------------------------------------------------------------
$mainMod = SUPER

# Application Launchers (Tap Super or Super+Space)
bindr = SUPER, SUPER_L, exec, $menu
bindr = SUPER, SUPER_R, exec, $menu
bind = $mainMod, Space, exec, $menu

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, $browser
bind = $mainMod, Q, killactive,
bind = $mainMod, C, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, S, layoutmsg, togglesplit

# Slide Workspaces with Super + Left / Right Arrow keys
bind = $mainMod, right, workspace, e+1
bind = $mainMod, left, workspace, e-1

# Direct Workspace Switching (1 - 7)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7

# Move Active Window to Workspace (1 - 7)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7

# Move Focus between Windows (Vim keys & Alt+Arrows)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod ALT, left, movefocus, l
bind = $mainMod ALT, right, movefocus, r
bind = $mainMod ALT, up, movefocus, u
bind = $mainMod ALT, down, movefocus, d

# Move Active Window across Workspaces with Super+Shift+Arrows
bind = $mainMod SHIFT, right, movetoworkspace, e+1
bind = $mainMod SHIFT, left, movetoworkspace, e-1

# Mouse Bindings (Move / Resize Windows)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Fn & Media Keys (ThinkPad Audio & Brightness via wpctl / brightnessctl)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshot with Print Screen key (selection to clipboard or whole screen to file)
bind = , Print, exec, $screenshot region
bind = SHIFT, Print, exec, $screenshot full

# Power & Session Management (Physical Power key + Super+Escape)
bindl = , XF86PowerOff, exec, /home/moonxplor/.local/bin/hypr-power.sh
bind  = $mainMod, Escape, exec, /home/moonxplor/.local/bin/hypr-power.sh

