# ==============================================================================
# Kitty Everforest Rice Configuration
# ==============================================================================

# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Shell & Environment
shell /usr/bin/fish
env LANG=en_IN.UTF-8
env LC_ALL=en_IN.UTF-8
env PATH=/home/moonxplor/.local/bin:/usr/local/bin:/usr/bin:/bin

# Window Appearance & Translucency
background_opacity 1.0
background_blur 0
window_padding_width 12
confirm_os_window_close 0
remember_window_size  yes
initial_window_width  860
initial_window_height 500

# Cursor
cursor                #a7c080
cursor_text_color     #272e33
cursor_shape          beam
cursor_blink_interval 0.5

# Everforest Dark Color Palette
background            #272e33
foreground            #d3c6aa
selection_background  #a7c080
selection_foreground  #272e33

# URL styling
url_color             #7fbbb3
url_style             curly

# Normal Colors
color0  #343f44
color1  #e67e80
color2  #a7c080
color3  #dbbc7f
color4  #7fbbb3
color5  #d699b6
color6  #83c092
color7  #d3c6aa

# Bright Colors
color8  #47555c
color9  #e67e80
color10 #a7c080
color11 #dbbc7f
color12 #7fbbb3
color13 #d699b6
color14 #83c092
color15 #eae2cf

# Tab Bar
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_edge          top
active_tab_foreground   #272e33
active_tab_background   #a7c080
active_tab_font_style   bold
inactive_tab_foreground #d3c6aa
inactive_tab_background #343f44

# Bell
enable_audio_bell no
visual_bell_duration 0.0
